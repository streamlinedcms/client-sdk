name: CI

on:
    # Label changes deliberately don't trigger a run: opening a PR with a label
    # would start two runs at once, and GitHub can judge the PR by whichever
    # one it records last, even if that one was cancelled. check-release-label
    # reads the labels when it runs instead, so after changing a release label,
    # re-run the "check-release-label / check" job.
    #
    # Edits do trigger a run, because changing a PR's base (e.g. retargeting a
    # PR opened against develop to master) changes which checks apply, and the
    # results from the old base would otherwise still count. Every job runs on
    # every edit rather than skipping title-only edits: a skipped required check
    # counts as passing, which would hide an earlier failure. That includes
    # edits to closed PRs, even though their runs may fail (a merged PR's merge
    # ref is gone): check results belong to the commit, so skipped checks from
    # a closed PR would count for any open PR with the same head commit.
    pull_request:
        types: [opened, synchronize, reopened, edited]
        branches: [master, develop]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Format check
              run: npm run format:check

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Create .env for build
              run: |
                  echo "SDK_API_URL=https://api.example.com/v1" >> .env
                  echo "SDK_APP_URL=https://app.example.com" >> .env

            - name: Build
              run: npm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/
                  retention-days: 1

    test:
        # Wait for the quick checks too, so a format, release label or
        # includes-master failure fails the PR without waiting on the slower
        # tests. build also provides the dist/ artifact the tests use.
        # Every job listed here must also be a required check on master
        # (scripts/setup-github.sh): if one fails, test is skipped, and GitHub
        # counts a skipped required check as passing.
        needs: [lint, build, check-release-label, includes-master]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist/

            - name: Run tests
              run: npm test

    check-release-label:
        uses: ./.github/workflows/check-release-label.yml
        permissions:
            contents: read
            pull-requests: read
        with:
            pr_number: ${{ github.event.pull_request.number }}
            base_ref: ${{ github.base_ref }}
            head_ref: ${{ github.head_ref }}

    # PRs to master must already include everything on master, so what ships is
    # what was tested on the branch; see scripts/check-includes-master.mjs
    includes-master:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read # to read the PR's current base
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # need master and the PR's head commit

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - name: Check the PR includes master
              run: node scripts/check-includes-master.mjs
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  BASE_REF: ${{ github.base_ref }}
                  HEAD_REF: ${{ github.head_ref }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
