name: Deploy Release

# Publishes every push to a release/X.Y.Z branch as a prerelease of X.Y.Z, once
# the tests pass. The branch's PR to master sets the stage: while the PR is a
# draft (or there is no PR yet) builds are betas and move the X.Y.Z-beta alias;
# once it's ready for review (or merged) they're release candidates and move
# X.Y.Z-rc. Each build is named after its commit (X.Y.Z-beta.<timestamp>.<sha>),
# so it can also be loaded by its exact version. Stable X.Y.Z is released by
# merging the PR (deploy-prod.yml); after that, the branch publishes nothing.
#
# release-stage.yml runs this on the branch when the PR changes stage, so the
# current commit is republished under the new stage without a push.
#
# The tests run in a job without the production environment, so test code never
# runs in the job that gets the Cloudflare token. (The deploy job still installs
# dependencies and builds, as deploy-prod.yml does.)
on:
    push:
        branches:
            - "release/**"
    workflow_dispatch:

# A newer push (or stage change) supersedes a run still in progress
concurrency:
    group: deploy-release-${{ github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read # to find the branch's PR to master and its stage

jobs:
    test:
        if: startsWith(github.ref, 'refs/heads/release/')
        runs-on: ubuntu-latest
        outputs:
            skip: ${{ steps.version.outputs.skip }}
            version: ${{ steps.version.outputs.version }}
            alias: ${{ steps.version.outputs.alias }}

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Determine release version and stage
              id: version
              env:
                  BRANCH: ${{ github.ref_name }}
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  OWNER: ${{ github.repository_owner }}
              run: |
                  if [[ ! "$BRANCH" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                      echo "::error::Release branches must be named release/X.Y.Z (e.g. release/1.5.0), not $BRANCH"
                      exit 1
                  fi
                  BASE_VERSION="${BRANCH#release/}"

                  if [ -n "$(git ls-remote --tags origin "refs/tags/v$BASE_VERSION")" ]; then
                      echo "::notice::$BASE_VERSION is already released; $BRANCH publishes nothing more. Delete the branch."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$PACKAGE_VERSION" != "$BASE_VERSION" ]; then
                      echo "::error::$BRANCH must carry version $BASE_VERSION in package.json, but it has $PACKAGE_VERSION"
                      exit 1
                  fi

                  # The newest open or merged PR from this branch to master sets
                  # the stage: draft (or none) is beta; ready or merged is rc
                  STAGE=$(gh api "repos/$GH_REPO/pulls?head=$OWNER:$BRANCH&base=master&state=all" --jq '
                      map(select(.state == "open" or .merged_at != null))
                      | sort_by(.created_at) | last
                      | if . == null or (.state == "open" and .draft) then "beta" else "rc" end')

                  TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
                  SHORT_SHA=$(git rev-parse --short HEAD)
                  VERSION="$BASE_VERSION-$STAGE.$TIMESTAMP.$SHORT_SHA"

                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "alias=$BASE_VERSION-$STAGE" >> "$GITHUB_OUTPUT"
                  echo "Publishing $VERSION as $BASE_VERSION-$STAGE"

            - name: Install dependencies
              if: steps.version.outputs.skip != 'true'
              run: npm ci

            # Everyone following the alias gets this build, so it must pass the
            # tests. Some tests load the built dist/, so test a build with
            # placeholder URLs, as CI does.
            - name: Build and test with placeholder URLs
              if: steps.version.outputs.skip != 'true'
              run: |
                  printf 'SDK_API_URL=https://api.example.com/v1\nSDK_APP_URL=https://app.example.com\n' > .env
                  npm run build
                  npm test

    deploy:
        needs: test
        if: needs.test.outputs.skip != 'true'
        runs-on: ubuntu-latest
        environment: production

        steps:
            - uses: actions/checkout@v7

            # Checked again here: "Re-run failed jobs" reuses the test job's
            # outputs from before the release
            - name: Check the version isn't released yet
              id: released
              env:
                  BRANCH: ${{ github.ref_name }}
              run: |
                  BASE_VERSION="${BRANCH#release/}"
                  if [ -n "$(git ls-remote --tags origin "refs/tags/v$BASE_VERSION")" ]; then
                      echo "::notice::$BASE_VERSION has been released since this run started; publishing nothing."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Setup Node.js
              if: steps.released.outputs.skip != 'true'
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install dependencies
              if: steps.released.outputs.skip != 'true'
              run: npm ci

            - name: Create .env for build
              if: steps.released.outputs.skip != 'true'
              run: |
                  echo "SDK_API_URL=${{ vars.SDK_API_URL }}" >> .env
                  echo "SDK_APP_URL=${{ vars.SDK_APP_URL }}" >> .env
                  echo "R2_BUCKET_PRODUCTION=${{ vars.R2_BUCKET_PRODUCTION }}" >> .env
                  echo "KV_NAMESPACE_PRODUCTION=${{ vars.KV_NAMESPACE_PRODUCTION }}" >> .env

            - name: Build
              if: steps.released.outputs.skip != 'true'
              run: npm run build
              env:
                  SDK_VERSION: ${{ needs.test.outputs.version }}

            # The build name belongs to this run, so a re-run of this job may
            # replace its files: it rebuilds the same commit, so they're the
            # same files unless the build settings changed in between
            - name: Upload to CDN
              if: steps.released.outputs.skip != 'true'
              run: |
                  if [ -z "$VERSION" ]; then
                      echo "::error::No build version from the test job"
                      exit 1
                  fi
                  node scripts/cdn-upload.js production --ci --skip-build --overwrite --version="$VERSION"
              env:
                  VERSION: ${{ needs.test.outputs.version }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            # Don't move the alias if the branch has moved on (or been deleted)
            # since this run started, where the newer commit's run publishes
            # instead, or if the version has been released meanwhile
            - name: Publish version
              if: steps.released.outputs.skip != 'true'
              env:
                  BRANCH: ${{ github.ref_name }}
                  VERSION: ${{ needs.test.outputs.version }}
                  ALIAS: ${{ needs.test.outputs.alias }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  HEAD=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
                  if [ "$HEAD" != "$GITHUB_SHA" ]; then
                      echo "::warning::$BRANCH has moved on or been deleted; leaving $ALIAS for the newer run."
                      node scripts/cdn-publish.js production --ci --version="$VERSION" --no-alias
                      exit 0
                  fi
                  if [ -n "$(git ls-remote --tags origin "refs/tags/v${BRANCH#release/}")" ]; then
                      echo "::notice::${BRANCH#release/} was released during this run; leaving $ALIAS as it is."
                      node scripts/cdn-publish.js production --ci --version="$VERSION" --no-alias
                      exit 0
                  fi
                  node scripts/cdn-publish.js production --ci --version="$VERSION" --alias="$ALIAS"
