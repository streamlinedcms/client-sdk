name: Check Release Label

# Checks that a PR to master has a release label matching the version in
# package.json; see scripts/check-release-version.mjs for the rules. PRs to
# other branches pass without checks.
on:
    workflow_call:
        inputs:
            pr_number:
                description: "Number of the PR whose labels to check"
                required: true
                type: number
            base_ref:
                description: "Base branch of the PR"
                required: true
                type: string
            head_ref:
                description: "Source branch of the PR"
                required: true
                type: string
            head_sha:
                description: "Commit at the tip of the PR's source branch"
                required: true
                type: string

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read # to read the PR's current labels

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # need tags and master to compare versions

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            # The labels are looked up when this runs rather than taken from the
            # event that started the run: CI doesn't run on label changes, and a
            # re-run reuses the original event, so its labels would be stale.
            - name: Check release label and version
              run: node scripts/check-release-version.mjs
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ inputs.pr_number }}
                  BASE_REF: ${{ inputs.base_ref }}
                  HEAD_REF: ${{ inputs.head_ref }}
                  HEAD_SHA: ${{ inputs.head_sha }}
