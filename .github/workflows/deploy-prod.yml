name: Deploy Production

# Releases the version in package.json when it lands on master: builds, uploads
# to the CDN, updates the aliases, then tags the commit v<version>. The version
# is set in the PR (the release label check makes sure it matches the label),
# so nothing is ever committed to master here.
#
# Idempotent via the tag: if v<version> already exists (a release:none merge,
# or a re-run after success) there is nothing to release. The tag is created
# last, so a failed publish can simply be re-run.
on:
    push:
        branches: [master]

concurrency:
    group: deploy-production
    cancel-in-progress: false

permissions:
    contents: write # push the release tag

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # need tags to tell whether this version is released

            - name: Determine version and whether it is already released
              id: check
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
                      echo "v$VERSION is already released; nothing to do."
                      echo "skip=true" >> $GITHUB_OUTPUT
                  else
                      echo "Releasing v$VERSION"
                  fi

            - name: Setup Node.js
              if: steps.check.outputs.skip != 'true'
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install dependencies
              if: steps.check.outputs.skip != 'true'
              run: npm ci

            - name: Create .env for build
              if: steps.check.outputs.skip != 'true'
              run: |
                  echo "SDK_API_URL=${{ vars.SDK_API_URL }}" >> .env
                  echo "SDK_APP_URL=${{ vars.SDK_APP_URL }}" >> .env
                  echo "R2_BUCKET_PRODUCTION=${{ vars.R2_BUCKET_PRODUCTION }}" >> .env
                  echo "KV_NAMESPACE_PRODUCTION=${{ vars.KV_NAMESPACE_PRODUCTION }}" >> .env

            - name: Build
              if: steps.check.outputs.skip != 'true'
              run: npm run build

            - name: Upload to CDN
              if: steps.check.outputs.skip != 'true'
              run: node scripts/cdn-upload.js production --ci --skip-build --skip-existing
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            # Prerelease versions (1.4.0-beta.0) update only the prerelease
            # aliases; see docs/versioning-strategy.md
            - name: Publish version
              if: steps.check.outputs.skip != 'true'
              run: node scripts/cdn-publish.js production --ci
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Tag the release
              if: steps.check.outputs.skip != 'true'
              run: |
                  git tag "v${{ steps.check.outputs.version }}"
                  git push origin "v${{ steps.check.outputs.version }}"
