name: Deploy Production

# Releases the version in package.json when it lands on master: builds, uploads
# to the CDN, updates the stable aliases, then tags the commit v<version>. The
# version is set in the PR (the release label check makes sure it matches the
# label), so nothing is ever committed to master here. Prereleases are
# published from release branches by deploy-release.yml, never from master.
#
# If v<version> already exists there is nothing to release (a release:none
# merge, or a re-run after success), unless the SDK changed since that tag,
# which fails the run. The tag is created last, so a failed release can simply
# be re-run; the upload replaces any files a failed attempt left behind.
#
# A run stops without releasing if master has moved on to a newer version, so
# re-running an old failed release can't move the aliases backwards.
on:
    push:
        branches: [master]

concurrency:
    group: deploy-production
    cancel-in-progress: false

permissions:
    contents: write # push the release tag

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production

        steps:
            # Don't leave the write token in the checkout for npm ci and the
            # build to find; only the tag step gets it
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # need tags to tell whether this version is released
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Determine version and whether it is already released
              id: check
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
                      echo "v$VERSION is already released."
                      node scripts/check-released-unchanged.mjs "$VERSION"
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "Releasing v$VERSION"
                  fi

            - name: Install dependencies
              if: steps.check.outputs.skip != 'true'
              run: npm ci

            - name: Create .env for build
              if: steps.check.outputs.skip != 'true'
              run: |
                  echo "SDK_API_URL=${{ vars.SDK_API_URL }}" >> .env
                  echo "SDK_APP_URL=${{ vars.SDK_APP_URL }}" >> .env
                  echo "R2_BUCKET_PRODUCTION=${{ vars.R2_BUCKET_PRODUCTION }}" >> .env
                  echo "KV_NAMESPACE_PRODUCTION=${{ vars.KV_NAMESPACE_PRODUCTION }}" >> .env

            - name: Build
              if: steps.check.outputs.skip != 'true'
              run: npm run build

            # Stop if master has moved on to another version since this push,
            # e.g. when re-running an old failed release: publishing it would
            # move the aliases backwards. Checked again before publishing.
            - name: Check master is still at this version
              id: current
              if: steps.check.outputs.skip != 'true'
              run: |
                  git fetch -q origin master
                  LATEST=$(git show origin/master:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
                  if [ "$LATEST" != "$VERSION" ]; then
                      echo "::warning::master has moved on to $LATEST, so v$VERSION won't be released."
                      echo "superseded=true" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  VERSION: ${{ steps.check.outputs.version }}

            - name: Upload to CDN
              if: steps.check.outputs.skip != 'true' && steps.current.outputs.superseded != 'true'
              run: node scripts/cdn-upload.js production --ci --skip-build --overwrite
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Check master is still at this version before publishing
              id: still-current
              if: steps.check.outputs.skip != 'true' && steps.current.outputs.superseded != 'true'
              run: |
                  git fetch -q origin master
                  LATEST=$(git show origin/master:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
                  if [ "$LATEST" != "$VERSION" ]; then
                      echo "::warning::master has moved on to $LATEST, so v$VERSION won't be released."
                      echo "superseded=true" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  VERSION: ${{ steps.check.outputs.version }}

            - name: Publish version
              if: steps.check.outputs.skip != 'true' && steps.current.outputs.superseded != 'true' && steps.still-current.outputs.superseded != 'true'
              run: node scripts/cdn-publish.js production --ci
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Tag the release
              if: steps.check.outputs.skip != 'true' && steps.current.outputs.superseded != 'true' && steps.still-current.outputs.superseded != 'true'
              run: |
                  git tag "v$VERSION"
                  git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "v$VERSION"
              env:
                  VERSION: ${{ steps.check.outputs.version }}
                  GH_TOKEN: ${{ github.token }}
