version: 2

# Weekly updates for npm packages and for the GitHub Actions the workflows use,
# opened against develop so they deploy to staging and ship with the next
# normal release. Minor and patch bumps arrive as one grouped PR per ecosystem;
# each major bump gets its own PR so a breaking upgrade doesn't block the rest.
#
# Security fixes come from Dependabot security updates, turned on in the repo
# settings: every security alert gets a fix PR as soon as it's raised, not on
# the weekly schedule. Dependabot only scans master, and these PRs always
# target master, even when develop already has the fix. The second npm entry
# below exists only to give them the release:patch label that PRs to master
# need; its open-pull-requests-limit of 0 stops it opening scheduled updates.
#
# How to handle each security PR depends on whether the fixed package ships in
# the SDK; see the Hotfixes section of CONTRIBUTING.md.
#
# Dependabot reads this file from the default branch (master), so changes take
# effect once they reach master.
updates:
    - package-ecosystem: npm
      directory: /
      target-branch: develop
      schedule:
          interval: weekly
      groups:
          # vitest and its plugins must share a version, so they move together,
          # majors included. Listed first because an update joins the first
          # group it matches.
          vitest:
              patterns: ["vitest", "@vitest/*"]
          minor-and-patch:
              update-types: [minor, patch]
      ignore:
          # @rollup/plugin-typescript doesn't support TypeScript 7 yet, so the
          # build fails with it. Remove once the plugin supports 7; tracked in
          # #138, waiting on https://github.com/rollup/plugins/issues/2016
          - dependency-name: typescript
            versions: [">=7"]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      labels: ["release:patch"]

    - package-ecosystem: github-actions
      directory: /
      target-branch: develop
      schedule:
          interval: weekly
      groups:
          minor-and-patch:
              update-types: [minor, patch]
